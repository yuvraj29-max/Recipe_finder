<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desi Recipe Finder</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="hero-content">
      <h1>🥘 Desi Recipe Finder</h1>
      <p>Discover famous Indian sweets, veg delights, and search globally!</p>
      
      <form id="search-form">
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search (e.g., paneer, chicken, aloo, cake)..." 
          required
        >
        <button type="submit" class="btn-search">Search</button>
      </form>
    </div>
  </header>

  <div class="container">
    <section class="results-section">
      <h2 id="results-heading">Famous Indian Veg & Sweets</h2>
      <div id="recipe-grid" class="recipe-grid">
        <p id="loading-text">Loading delicious recipes...</p>
      </div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
